name: "CI: FigmaPot Lint"

# Fast gate for card branches (critic/12): cljfmt, clj-kondo and stylelint
# (~3 min) and, in a parallel job, the frontend unit tests (~8 min, critic/13)
# without the bundle and image. The full build, tests and image
# (figmapot-ci.yml) run on `figmapot` and `dg/train-**`.

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - 'dg/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVENV_IMAGE: penpotapp/devenv:latest

jobs:
  frontend-lint:
    name: "Frontend Lint"
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull devenv image
        run: docker pull "$DEVENV_IMAGE"

      - name: Lint
        run: |
          docker run --rm \
            --mount source="$GITHUB_WORKSPACE",type=bind,target=/home/penpot/penpot \
            -w /home/penpot/penpot/frontend \
            "$DEVENV_IMAGE" bash -c 'pnpm install && pnpm run lint:clj && pnpm run check-fmt:clj && pnpm run lint:scss'

  frontend-test:
    name: "Frontend Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # Same disk cleanup as figmapot-ci.yml: the wasm build and shadow-cljs
      # compile do not fit next to the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull devenv image
        run: docker pull "$DEVENV_IMAGE"

      - name: Tests
        run: |
          docker run --rm \
            --mount source="$GITHUB_WORKSPACE",type=bind,target=/home/penpot/penpot \
            -w /home/penpot/penpot/frontend \
            "$DEVENV_IMAGE" bash -c 'pnpm install && pnpm run test'
