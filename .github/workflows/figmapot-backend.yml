name: "CI: FigmaPot Backend"

# Fork-owned backend CI. Upstream's tests-backend.yml needs the self-hosted
# penpot-extended-runner; this runs the same fmt/lint/tests on a hosted runner
# and publishes the backend image by digest, for the isolated stand.
# Runs only when backend or common code changes, or on demand.

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - figmapot
      - 'dg/**'
    paths:
      - 'backend/**'
      - 'common/**'
      - '.github/workflows/figmapot-backend.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVENV_IMAGE: penpotapp/devenv:latest

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Same services as tests-backend.yml, published on host ports because the
    # devenv runs with `docker run --network host` (see frontend-test in
    # figmapot-ci.yml for why there is no job-level container).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: penpot_test
          POSTGRES_PASSWORD: penpot_test
          POSTGRES_DB: penpot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:9
        ports:
          - 6379:6379

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull devenv image
        run: docker pull "$DEVENV_IMAGE"

      - name: Fmt and lint
        run: |
          docker run --rm \
            --mount source="$GITHUB_WORKSPACE",type=bind,target=/home/penpot/penpot \
            -w /home/penpot/penpot/backend \
            "$DEVENV_IMAGE" bash -c \
            'cljfmt check --parallel=true src/ test/ && clj-kondo --parallel --lint ../common/src/ src/'

      - name: Tests
        run: |
          docker run --rm --network host \
            --mount source="$GITHUB_WORKSPACE",type=bind,target=/home/penpot/penpot \
            -w /home/penpot/penpot/backend \
            -e PENPOT_TEST_DATABASE_URI="postgresql://localhost/penpot_test" \
            -e PENPOT_TEST_DATABASE_USERNAME=penpot_test \
            -e PENPOT_TEST_DATABASE_PASSWORD=penpot_test \
            -e PENPOT_TEST_REDIS_URI="redis://localhost/1" \
            "$DEVENV_IMAGE" bash -c 'mkdir -p /tmp/penpot && clojure -M:dev:test'

  backend-image:
    name: "Backend Image"
    needs: backend-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # print-current-version (manage.sh) uses `git describe --tags`.
          fetch-depth: 0

      # build-backend-bundle (manage.sh:1238) builds in the devenv image and
      # moves backend/target/dist to ./bundles/backend.
      - name: Build backend bundle
        run: ./manage.sh build-backend-bundle

      # Same staging as _build-release-docker-image in manage.sh.
      - name: Stage bundle for the backend image
        run: |
          rm -rf ./docker/images/bundle-backend
          cp -a ./bundles/backend ./docker/images/bundle-backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/images
          file: ./docker/images/Dockerfile.backend
          build-args: |
            BUNDLE_PATH=./bundle-backend/
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/figmapot-backend:${{ github.sha }}

      - name: Write job summary
        run: |
          {
            echo "### Backend image"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/figmapot-backend:${{ github.sha }}\`"
            echo "- Digest: \`${{ steps.image.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
