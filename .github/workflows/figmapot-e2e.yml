name: "CI: FigmaPot E2E"

# Upstream Playwright UI suite (frontend/playwright, mocked backend: no
# database, no prod data) on a hosted runner. Upstream tests-e2e.yml needs
# the self-hosted penpot-extended-runner; this runs the same suite in the
# devenv image with an explicit `docker run`, like figmapot-ci.yml.

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - figmapot
      - 'dg/train-**'
      - 'dg/e2e-**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEVENV_IMAGE: penpotapp/devenv:latest

jobs:
  e2e:
    name: "Frontend E2E"
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull devenv image
        run: docker pull "$DEVENV_IMAGE"

      # Bundle build (scripts/build) and the suite run in one container so
      # the Playwright browser download stays inside it.
      - name: Build bundle and run Playwright
        run: |
          docker run --rm --network host -e CI=true \
            --mount source="$GITHUB_WORKSPACE",type=bind,target=/home/penpot/penpot \
            -w /home/penpot/penpot/frontend \
            "$DEVENV_IMAGE" bash -c '
              set -e
              pnpm install
              ./scripts/build
              pnpm exec playwright install chromium
              pnpm exec playwright test --project default --workers=2 \
                --reporter=list,json > /tmp/pw-list.txt 2>&1 || rc=$?
              cp /tmp/pw-list.txt test-results-list.txt
              exit ${rc:-0}'

      - name: Summary
        if: always()
        run: |
          f=frontend/test-results-list.txt
          [ -f "$f" ] || exit 0
          { echo '```'; grep -E '^\s+[0-9]+ (passed|failed|flaky|skipped)|✘' "$f" | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            frontend/test-results-list.txt
          if-no-files-found: ignore
          retention-days: 7
